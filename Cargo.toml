[package]
name = "chess_engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["embedded_nnue"]
embedded_nnue = []
serde = ["dep:serde"]
logging = [] # Kept for existing build commands.
syzygy = ["dep:fathom-syzygy-sys"]

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"], optional = true }
parking_lot = "0.12"
smallvec = "1.15"
fathom-syzygy-sys = { version = "0.1", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "engine_benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

# Keep compile-time retrograde generation fast in both profiles.
[profile.dev.build-override]
opt-level = 1

[profile.release.build-override]
opt-level = 1
